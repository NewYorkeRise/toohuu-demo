<title>TOOHUU — админ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;600&family=Golos+Text:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#171614; --ink-2:#57534C; --ink-3:#928C82;
    --paper:#EDEAE4; --card:#FFF; --line:#DDD8CF; --line-2:#EBE7E0;
    --signal:#1E4FE0; --signal-soft:#E8ECFC;
    --ok:#0F6B45; --ok-soft:#DFF0E7;
    --warn:#A65B10; --warn-soft:#F9EBD8;
    --stop:#A82121; --stop-soft:#F8E5E5;
    --on-ink:#fff; --subtle:#FBFAF8; --img:#E4E0D8; --bar:rgba(255,255,255,.94);
    --hot-bg:#2B1A12; --hot-fg:#F6C89A; --ticket:#171614;
    color-scheme: light;
  }
  /* ── dark mode: follows the phone / computer setting automatically ── */
  @media (prefers-color-scheme: dark){
    :root{
      color-scheme: dark;
      --ink:#EDEAE4; --ink-2:#B9B4AB; --ink-3:#8C877E; --on-ink:#171614;
      --paper:#121110; --card:#1C1B19; --line:#36332E; --line-2:#2A2825;
      --subtle:#232120; --img:#2B2926; --bar:rgba(28,27,25,.92);
      --hot-bg:#F6C89A; --hot-fg:#2B1A12;
      --signal:#4C74FF; --signal-soft:#1B2340;
      --ok:#5FD3A0; --ok-soft:#163126;
      --warn:#F0B26A; --warn-soft:#3A2A17;
      --stop:#E5534B; --stop-soft:#3C1C1B;
      --ticket:#262420;
    }
    .mark img{filter:invert(1)}                 /* black logo -> white on dark */
  }

  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Golos Text',system-ui,sans-serif;background:var(--paper);color:var(--ink);
       -webkit-font-smoothing:antialiased;padding:22px 14px 60px}
  .wrap{max-width:1000px;margin:0 auto;background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:hidden}

  header{display:flex;align-items:center;gap:12px;padding:15px 20px;border-bottom:1px solid var(--line)}
  .mark{width:44px;display:grid;place-items:center;flex:none}
  .mark img{width:100%;height:auto;display:block}
  .brand{font-family:'Unbounded';font-size:15px;letter-spacing:1.4px}
  .who{margin-left:auto;font-size:12px;color:var(--ink-3)}

  nav{display:flex;gap:4px;padding:10px 14px;border-bottom:1px solid var(--line);background:var(--subtle)}
  nav button{border:none;background:none;font:inherit;font-size:13.5px;padding:8px 14px;border-radius:9px;
             cursor:pointer;color:var(--ink-2)}
  nav button[aria-current="true"]{background:var(--ink);color:var(--on-ink)}
  nav button:focus-visible{outline:2px solid var(--signal);outline-offset:2px}
  .badge{display:inline-block;margin-left:6px;background:var(--stop);color:#fff;font-size:10px;font-weight:600;
         border-radius:999px;padding:1px 6px;vertical-align:1px}

  main{padding:20px}
  h1{font-family:'Unbounded';font-size:20px;font-weight:400;letter-spacing:-.3px}
  .lede{font-size:13px;color:var(--ink-2);margin-top:5px;line-height:1.55}
  .eyebrow{font-size:10.5px;letter-spacing:1.5px;text-transform:uppercase;color:var(--ink-3);margin:22px 0 9px}

  table{width:100%;border-collapse:collapse;margin-top:12px;font-size:13px}
  th{text-align:left;font-weight:500;font-size:11px;letter-spacing:.8px;text-transform:uppercase;color:var(--ink-3);
     padding:8px 10px;border-bottom:1px solid var(--line)}
  td{padding:11px 10px;border-bottom:1px solid var(--line-2);vertical-align:middle}
  tr:last-child td{border-bottom:none}
  .mono{font-family:'Unbounded';font-size:12px;letter-spacing:.5px}
  .num{text-align:right;font-family:'Unbounded';font-size:12.5px;white-space:nowrap}

  .pill{display:inline-block;font-size:11px;font-weight:600;padding:3px 8px;border-radius:6px;white-space:nowrap}
  .pill.paid{background:var(--ok-soft);color:var(--ok)}
  .pill.pending{background:var(--warn-soft);color:var(--warn)}
  .pill.cancel{background:var(--stop-soft);color:var(--stop)}
  .pill.lock{background:var(--line-2);color:var(--ink-3)}
  .pill.hot{background:var(--hot-bg);color:var(--hot-fg)}
  .pill.new{background:var(--signal);color:#fff}
  .tick{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--ink);letter-spacing:0;
        text-transform:none;margin:0;padding:9px 0}
  .tick input{width:16px;height:16px;accent-color:var(--ink);cursor:pointer}
  /* variants: a list, not a 7-column table, so it works one-handed on a phone */
  .vfilter{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-top:10px}
  .vfilter>span{font-size:10.5px;letter-spacing:1.3px;text-transform:uppercase;color:var(--ink-3);min-width:70px}
  .fchip{flex:none;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 12px;
         font:inherit;font-size:12.5px;cursor:pointer;color:var(--ink)}
  .fchip[aria-pressed="true"]{background:var(--ink);color:var(--on-ink);border-color:var(--ink)}
  .vcount{font-size:12.5px;color:var(--ink-3);margin-left:auto}
  .vlist{margin-top:12px;border:1px solid var(--line);border-radius:12px;overflow:hidden}
  .vrow{display:grid;grid-template-columns:minmax(170px,1.3fr) 100px 118px 2fr;gap:10px 14px;align-items:center;
        padding:9px 12px;border-bottom:1px solid var(--line-2)}
  .vrow:last-child{border-bottom:none}
  .vrow.off{background:var(--subtle)}
  .vrow.off .vsel span,.vrow.off .vprice{opacity:.45}
  label.vsel,label.vpre{display:flex;align-items:center;margin:0;letter-spacing:0;text-transform:none;cursor:pointer}
  label.vsel{gap:10px;font-size:13.5px;color:var(--ink)}
  label.vpre{gap:7px;font-size:12.5px;color:var(--ink-2)}
  .vsel input,.vpre input{width:18px;height:18px;accent-color:var(--ink);flex:none;margin:0}
  .vprice{font-family:'Unbounded';font-size:12.5px;text-align:right;white-space:nowrap}
  .vstock{display:flex;flex-wrap:wrap;gap:8px 14px;justify-content:flex-end}
  .stepper{display:flex;align-items:center;gap:4px}
  .stepper span{font-size:11.5px;color:var(--ink-3);margin-right:2px;max-width:96px;overflow:hidden;
                text-overflow:ellipsis;white-space:nowrap}
  .stepper button{width:30px;height:30px;border:1px solid var(--line);border-radius:8px;background:var(--card);
                  font-size:16px;line-height:1;cursor:pointer;color:var(--ink);padding:0}
  .stepper button:disabled{opacity:.35;cursor:default}
  .stepper input{width:54px;padding:5px 4px;text-align:center;font-size:13px}
  .stepper.dim{opacity:.5}
  .vempty{padding:18px;text-align:center;color:var(--ink-3);font-size:13px}
  /* branches */
  .blist{margin-top:14px;border:1px solid var(--line);border-radius:12px}
  .brow{display:grid;grid-template-columns:1fr auto auto;gap:10px 12px;align-items:center;padding:10px 12px;
        border-bottom:1px solid var(--line-2)}
  .brow:last-child{border-bottom:none}
  .bmeta{font-size:12px;color:var(--ink-3);white-space:nowrap}
  .gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:10px;padding:10px;
           border:1.5px dashed var(--line);border-radius:14px;background:var(--subtle);transition:border-color .15s,background .15s}
  .gallery.drag{border-color:var(--signal);background:var(--signal-soft)}
  .gtile{position:relative;aspect-ratio:1;border-radius:10px;overflow:hidden;background:var(--img);border:2px solid transparent}
  .gtile.main{border-color:var(--ink)}
  .gtile img{width:100%;height:100%;object-fit:cover;display:block;cursor:pointer}
  .gmain{position:absolute;left:6px;top:6px;background:var(--ink);color:var(--on-ink);font-size:10.5px;font-weight:600;
         padding:2px 7px;border-radius:6px}
  .gx{position:absolute;right:5px;top:5px;width:26px;height:26px;border-radius:50%;border:none;
      background:rgba(0,0,0,.62);color:#fff;cursor:pointer;font-size:15px;line-height:1}
  .gmove{position:absolute;left:5px;right:5px;bottom:5px;display:flex;justify-content:space-between}
  .gmove button{width:28px;height:26px;border:none;border-radius:7px;background:rgba(255,255,255,.9);color:#171614;cursor:pointer;font-size:13px}
  .gmove button:disabled{opacity:0;pointer-events:none}
  label.gadd{aspect-ratio:1;margin:0;border:1.5px dashed var(--ink-3);border-radius:10px;background:var(--card);
             display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;cursor:pointer;
             font-size:12px;letter-spacing:0;text-transform:none;color:var(--ink-2);text-align:center}
  label.gadd b{font-size:28px;font-weight:400;line-height:1}
  label.gadd:hover{border-color:var(--ink)}
  .ghint{font-size:12px;color:var(--ink-3);margin-top:7px;line-height:1.5}
  details.more{margin:0 0 14px}
  details.more summary{cursor:pointer;font-size:12.5px;color:var(--ink-2)}

  select,input,textarea{border:1px solid var(--line);border-radius:9px;padding:9px 11px;font:inherit;font-size:13.5px;
    background:var(--card);color:var(--ink);width:100%;resize:none}
  select:focus,input:focus,textarea:focus{outline:none;border-color:var(--signal)}
  select:disabled{background:var(--line-2);color:var(--ink-3);cursor:not-allowed}
  label{display:block;font-size:10.5px;letter-spacing:1.3px;text-transform:uppercase;color:var(--ink-3);margin:0 0 6px}
  .field{margin-bottom:14px}
  .cols{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  .cols3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px}

  .btn{border:none;border-radius:10px;padding:11px 18px;font:inherit;font-size:13.5px;font-weight:600;
       background:var(--ink);color:var(--on-ink);cursor:pointer}
  .btn:disabled{background:var(--line);color:var(--ink-3);cursor:not-allowed}
  .btn.signal{background:var(--signal);color:#fff}
  .btn.ghost{background:none;border:1px solid var(--line);color:var(--ink);font-weight:500}
  .btn.sm{padding:7px 12px;font-size:12.5px}
  .btn:focus-visible{outline:2px solid var(--signal);outline-offset:2px}
  .bar{display:flex;gap:9px;align-items:center;margin-top:18px;flex-wrap:wrap}

  .note{font-size:12px;line-height:1.6;color:var(--ink-2);background:var(--signal-soft);border-radius:10px;
        padding:11px 13px;margin-top:14px}
  .note.warn{background:var(--warn-soft);color:var(--warn)}
  .note.lock{background:var(--line-2);color:var(--ink-2)}
  .note b{font-weight:600}

  .steps{display:flex;gap:6px;margin-bottom:20px;flex-wrap:wrap}
  .stp{font-size:12px;padding:6px 11px;border-radius:8px;background:var(--line-2);color:var(--ink-3)}
  .stp.on{background:var(--ink);color:var(--on-ink)}
  .stp.done{background:var(--ok-soft);color:var(--ok)}

  .chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
  .chip{display:flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:8px;padding:6px 10px;
        font-size:12.5px;background:var(--subtle)}
  .chip button{border:none;background:none;color:var(--ink-3);cursor:pointer;font-size:15px;line-height:1;padding:0}

  .off td{opacity:.35}
  .off input[type=number]{pointer-events:none}

  .kpi{display:grid;grid-template-columns:repeat(4,1fr);gap:11px;margin-top:14px}
  .k{border:1px solid var(--line);border-radius:12px;padding:13px 14px}
  .k b{display:block;font-family:'Unbounded';font-size:20px;font-weight:400;margin-bottom:3px}
  .k span{font-size:11.5px;color:var(--ink-3)}

  .thumb{width:40px;height:40px;border-radius:8px;object-fit:cover;background:var(--img)}
  .rowflex{display:flex;align-items:center;gap:10px}
  .foot{max-width:1000px;margin:14px auto 0;font-size:12px;color:var(--ink-2);text-align:center;line-height:1.6}
  /* laptop keeps 1000px; big desktop screens get room for the wide tables */
  @media (min-width:1440px){ .wrap{max-width:1200px} main{padding:26px} }
  /* phones and iPads in portrait (744–834px) get the card layout; tables need ≥900px */
  @media (max-width:899px){
    body{padding:0}
    .wrap{border:none;border-radius:0;min-height:100dvh}
    header{position:sticky;top:0;z-index:12;background:var(--card);
           padding-top:max(15px,env(safe-area-inset-top))}
    .who{display:none}
    nav{position:sticky;top:66px;z-index:11;overflow-x:auto;scrollbar-width:none}
    nav::-webkit-scrollbar{display:none}
    nav button{flex:none;white-space:nowrap}
    main{padding:16px 15px calc(30px + env(safe-area-inset-bottom))}
    .cols,.cols3{grid-template-columns:1fr;gap:0}
    .kpi{grid-template-columns:1fr 1fr}
    input,select,textarea{font-size:16px}          /* stops iOS zooming on focus */
    .btn{padding:13px 18px}
    .bar .btn{flex:1}

    /* A 7-column table cannot be read on a 390px screen.
       Each row becomes a card; the header labels move onto the cells. */
    table{display:block}
    thead{display:none}
    tbody,tr{display:block}
    tr{border:1px solid var(--line);border-radius:12px;padding:6px 12px;margin-bottom:10px}
    td{display:flex;align-items:center;gap:12px;padding:9px 0;border-bottom:1px solid var(--line-2);
       text-align:left!important}
    tr td:last-child{border-bottom:none}
    td:before{content:attr(data-l);flex:none;width:88px;font-size:10.5px;letter-spacing:.8px;
              text-transform:uppercase;color:var(--ink-3)}
    td.num{justify-content:flex-start}
    td select{width:auto;flex:1}

    /* the save / continue buttons stay under the thumb while scrolling a long form */
    .bar.actions{position:sticky;bottom:0;z-index:5;background:var(--card);margin:18px -15px 0;
                 padding:12px 15px calc(12px + env(safe-area-inset-bottom));border-top:1px solid var(--line)}
    .vfilter{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
    .vfilter::-webkit-scrollbar{display:none}
    .vcount{flex-basis:100%;margin-left:0}
    .vrow{grid-template-columns:1fr auto;gap:10px;padding:12px}
    label.vpre,.vstock{grid-column:1/-1}
    .vstock{justify-content:flex-start}
    .vrow.off label.vpre,.vrow.off .vstock{display:none}
    .stepper button{width:40px;height:40px;font-size:18px}
    .stepper input{width:60px;padding:8px 4px}
    .brow{grid-template-columns:1fr auto}
    .bmeta{grid-column:1/-1;order:3;white-space:normal}

  }
</style>
</head>

<p class="foot">Үзүүлэн админ. Дэлгүүртэй ижил өгөгдлийн загвар дээр ажиллана.<br>

<script>
const IMG = id => `https://drive.google.com/thumbnail?id=${id}&sz=w400`;

// Google Drive API key (Drive API only, restricted to this site's domain).
// Needed to LIST the files in a folder; a public folder link alone is not enough.
const DRIVE_API_KEY = '';

// Accepts a folder link in any common form, or a bare ID. Returns the ID or ''.
function driveFolderId(input){
  const s = String(input || '').trim();
  let m = s.match(/\/folders\/([A-Za-z0-9_-]{10,})/) || s.match(/[?&]id=([A-Za-z0-9_-]{10,})/);
  if (m) return m[1];
  return /^[A-Za-z0-9_-]{10,}$/.test(s) ? s : '';
}

async function loadFolder(){
  const d = draft;
  const id = driveFolderId(d.folder);
  d.images = []; d.imgError = '';
  if (!id){ d.imgState = 'error'; d.imgError = 'Google Drive хавтасны холбоос буруу байна.'; return render(); }
  if (!DRIVE_API_KEY){ d.imgState = 'error';
    d.imgError = 'Drive API түлхүүр тохируулаагүй байна (admin.html доторх DRIVE_API_KEY).'; return render(); }
  d.imgState = 'loading'; render();
  const q = encodeURIComponent(`'${id}' in parents and mimeType contains 'image/' and trashed = false`);
  const url = `https://www.googleapis.com/drive/v3/files?q=${q}&fields=files(id,name)&pageSize=100&key=${DRIVE_API_KEY}`;
  try {
    const r = await fetch(url);
    if (!r.ok){
      d.imgState = 'error';
      d.imgError = r.status === 404 || r.status === 403
        ? 'Хавтас олдсонгүй эсвэл нээлттэй биш. Drive дээр Share → "Anyone with the link" → Viewer болго.'
        : `Drive алдаа (${r.status}).`;
      return render();
    }
    const files = ((await r.json()).files || [])
      .sort((a,b) => a.name.localeCompare(b.name, undefined, { numeric:true }));   // 2.png before 10.png
    if (!files.length){ d.imgState = 'error'; d.imgError = 'Энэ хавтсанд зураг алга.'; return render(); }
    d.images = files.map(f => IMG(f.id)); d.imgState = 'ok';
  } catch(e){
    d.imgState = 'error'; d.imgError = 'Сүлжээний алдаа. Дахин оролдоно уу.';
  }
  render();
}

      INV[id] = {};
      if(!pre){ const a=rnd(4), b=rnd(3); if(a) INV[id].b1=a; if(b) INV[id].b2=b; }
    }
    PRODUCTS.push(p);
  });

    .forEach(([type,name,price,fresh], j) => {

                  category:'main', type, hot:false, fresh, axes:axes.map(a=>({name:a.name, values:a.values})), variants:[] };
      let combos = [{}];
      for (const a of axes) combos = combos.flatMap(c => a.values.map(v => ({ ...c, [a.name]: v })));

        p.variants.push({ id:vid, sku:`${p.sku}-${k}`, options, is_preorder:false,
                          price_delta: axes.reduce((s,a)=>s+(a.deltas[options[a.name]]||0),0) });
        INV[vid] = { b1:rnd(5), b2:rnd(4) };

}

const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const comboKey = (axes, opts) => JSON.stringify(axes.map(a => opts[a.name]));

// Ids must never be reused: after a delete, "length+1" would collide with a live product.
const nextProductId = () => 'm' + (Math.max(0, ...PRODUCTS.map(p => +p.id.slice(1) || 0)) + 1);

// Recover per-axis surcharges from existing variants. Prices are additive
// (axis surcharges summed), so two variants that differ on one axis only
// give that axis value's surcharge exactly.
function fitDeltas(p){
  return p.axes.map(a => {
    const ref = a.values[0], deltas = { [ref]: 0 };
    const others = p.axes.filter(x => x.name !== a.name);
    const sig = v => JSON.stringify(others.map(x => v.options[x.name]));
    const atRef = new Map(p.variants.filter(v => v.options[a.name] === ref).map(v => [sig(v), v.price_delta]));
    for (const val of a.values.slice(1)) {
      const pair = p.variants.find(v => v.options[a.name] === val && atRef.has(sig(v)));
      deltas[val] = pair ? pair.price_delta - atRef.get(sig(pair)) : 0;
    }
    return { name: a.name, values: [...a.values], deltas };
  });
}

// A single image: a Drive *file* share link (needs no API key) or any https image URL.
function driveImageUrl(input){
  const s = String(input || '').trim();
  if (/\/folders\//.test(s)) return { error:'Энэ бол хавтасны холбоос. Дээрх «Google Drive хавтас» талбарт оруулна уу.' };
  const m = s.match(/\/file\/d\/([A-Za-z0-9_-]{10,})/) || s.match(/[?&]id=([A-Za-z0-9_-]{10,})/);
  if (m) return { url: IMG(m[1]) };
  if (/^https:\/\/\S+$/.test(s)) return { url: s };
  return { error:'Зургийн холбоос буруу байна (https://… эсвэл Google Drive файлын холбоос).' };
}

// Photos straight from the computer or phone. Each one is shrunk in the
// browser (max 1600px, WebP) so a 5 MB phone photo becomes ~150 KB.
const MAX_SIDE = 1600, MAX_FILE_MB = 30;
const isHeic = f => /\.(heic|heif)$/i.test(f.name) || /hei[cf]/i.test(f.type);

async function shrinkImage(file){
  const bmp = await createImageBitmap(file);     // throws for formats this browser can't decode (HEIC in Chrome)
  const k = Math.min(1, MAX_SIDE / Math.max(bmp.width, bmp.height));
  const w = Math.round(bmp.width * k), h = Math.round(bmp.height * k);
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  c.getContext('2d').drawImage(bmp, 0, 0, w, h);
  if (bmp.close) bmp.close();
  const blob = await new Promise(res => c.toBlob(res, 'image/webp', 0.82));
  if (!blob) throw new Error('encode failed');
  return blob;
}

async function addImageFiles(fileList){
  const d = draft, files = [...(fileList || [])];
  if (!files.length) return;
  const errs = [];
  d.imgState = ''; d.imgError = ''; d.imgBusy = files.length; render();
  for (const f of files){
    if (!/^image\//.test(f.type) && !isHeic(f)) errs.push(`${f.name}: зураг биш`);
    else if (f.size > MAX_FILE_MB * 1048576) errs.push(`${f.name}: ${MAX_FILE_MB}MB-аас том`);
    else {
      try { d.images.push(URL.createObjectURL(await shrinkImage(f))); }
      catch { errs.push(isHeic(f) ? `${f.name}: HEIC (iPhone) формат энэ хөтөч дээр уншигдахгүй — JPG болгож оруулна уу`
                                  : `${f.name}: уншиж чадсангүй`); }
    }
    d.imgBusy--;
    if (draft !== d) return;                     // admin left this form while photos were processing
    render();
  }
  d.imgBusy = 0;
  if (errs.length){ d.imgState = 'error'; d.imgError = errs.join(' · '); }
  render();
}

function onDropImages(e){
  e.preventDefault();
  e.currentTarget.classList.remove('drag');
  addImageFiles(e.dataTransfer && e.dataTransfer.files);
}

function buildCombos(){
  const lists = draft.axes.map(a=>a.values);
  let rows = [{}];
  draft.axes.forEach((a,i)=>{
    const next=[];
    for(const r of rows) for(const v of lists[i]) next.push({...r,[a.name]:v});
    rows = next;
  });
  // Priority: what the admin already set in step 3 > the saved variant > a fresh default.
  const prior = new Map(draft.combos.map(c => [comboKey(draft.axes, c.opts), c]));
  draft.combos = rows.map(opts=>{
    const key = comboKey(draft.axes, opts);
    const delta = draft.axes.reduce((s,a)=>s+(a.deltas[opts[a.name]]||0),0);
    const was = prior.get(key);
    if (was) return { ...was, opts, delta };
    const v = draft.existing.get(key);
    if (v) return { opts, on:true, preorder:!!v.is_preorder, delta,
                    stock:Object.fromEntries(BRANCHES.map(b => [b.id, (INV[v.id]||{})[b.id]||0])) };
    // When editing, a combo built only from values that already existed was
    // deliberately not made — keep it off. Combos using a newly added value start on.
    const isNew = !draft.origValues || draft.axes.some(a => !(draft.origValues[a.name]||[]).includes(opts[a.name]));
    return { opts, on:isNew, preorder:false, delta, stock:emptyStock() };
  });
}

    <div class="vlist">

      нэг салбарт 1, нөгөөд 2 бол худал — нэг ч салбар 3 хос илгээж чадахгүй.</div>
    <div class="bar actions">
      <button class="btn ghost" onclick="draft.step=2;render()">← Тэнхлэг засах</button>
      <button class="btn signal" ${on.length?'':'disabled'} onclick="saveDraft()">
        ${d.editingId ? 'Өөрчлөлт хадгалах' : on.length+' хувилбар хадгалах'}</button>
    </div>

// Which variant rows the current filter shows; bulk buttons act on these only.
function visibleIdx(){
  const d = draft, vf = d.vf || {}, fa = d.axes.slice(0, -1);
  return d.combos.map((_,i)=>i).filter(i => fa.every(a => !vf[a.name] || d.combos[i].opts[a.name] === vf[a.name]));
}
function setVF(ai, vi){
  const a = draft.axes[ai];
  draft.vf = draft.vf || {};
  draft.vf[a.name] = vi < 0 ? null : a.values[vi];
  render();
}
function stepStock(i, bid, delta){
  const st = draft.combos[i].stock;
  st[bid] = Math.max(0, (st[bid] || 0) + delta);
  render();
}
function setStock(i, bid, value){
  const n = Math.floor(Number(value));
  draft.combos[i].stock[bid] = Number.isFinite(n) && n > 0 ? Math.min(n, 99999) : 0;
  render();
}

function addVal(ai, v){
  v = String(v).trim(); if(!v) return;
  const a = draft.axes[ai];
  if(a.values.includes(v)) return;
  a.values.push(v); a.deltas[v] = 0; render();
}
function rmVal(ai, vi){
  const a = draft.axes[ai];
  if(a.values.length<=1) return;
  delete a.deltas[a.values[vi]];
  a.values.splice(vi,1); render();
}
const allOn = v => { visibleIdx().forEach(i => { draft.combos[i].on = v; }); render(); };
const fillStock = n => { visibleIdx().forEach(i => { const c = draft.combos[i];
  if (c.on && !c.preorder) BRANCHES.forEach(b => { c.stock[b.id] = n; }); }); render(); };

function saveDraft(){
  const d = draft;
  const old = d.editingId && PRODUCTS.find(x => x.id === d.editingId);
  const id = old ? old.id : nextProductId();
  const p = { id, sku:d.sku, name:d.name, base_price:d.price, description:d.description,
              image: d.images[0] || NOPHOTO, images:[...d.images], is_active:d.active,
              category:d.type === 'rug' ? 'main' : d.category, hot:d.hot, fresh:d.fresh, type:d.type,
              axes:d.axes.map(a=>({name:a.name, values:[...a.values]})), variants:[] };
  const stamp = Date.now().toString(36);
  const kept = new Set();
  d.combos.filter(c=>c.on).forEach((c,i)=>{
    const prev = d.existing.get(comboKey(d.axes, c.opts));          // same option values -> same variant id
    const vid = prev ? prev.id : `${id}-${stamp}-${i}`;
    kept.add(vid);
    p.variants.push({ id:vid, sku:`${d.sku}-${Object.values(c.opts).join('-')}`.toUpperCase(),
                      options:c.opts, price_delta:c.delta, is_preorder:c.preorder });
    INV[vid] = c.preorder ? {} : Object.fromEntries(BRANCHES.map(b => [b.id, c.stock[b.id] || 0]));
  });
  if (old) {
    old.variants.forEach(v => { if (!kept.has(v.id)) delete INV[v.id]; });   // drop stock of removed variants
    PRODUCTS[PRODUCTS.indexOf(old)] = p;
  } else {
    PRODUCTS.push(p);
  }
  setTab('products');
}

// ── STOCK ─────────────────────────────────────────────────────────
function stockView(){
  const rows = [];
  for(const p of PRODUCTS) for(const v of p.variants){
    const inv = INV[v.id]||{};
    const total = Object.values(inv).reduce((s,q)=>s+q,0);
    if(v.is_preorder || total > 3) continue;         // only what needs attention
    rows.push({p,v,inv,total});
  }
  rows.sort((a,b)=>a.total-b.total);
  main.innerHTML = `
    <h1>Үлдэгдэл</h1>
    <p class="lede">Дуусах гэж буй хувилбарууд. Захиалгаар хийгддэг хосыг оруулаагүй — тэдэнд үлдэгдэл хамаагүй.</p>
    <table>
      <thead><tr><th>Загвар</th><th>Хувилбар</th>
        ${BRANCHES.map(b=>`<th class="num">${b.name}</th>`).join('')}<th class="num">Нийт</th><th></th></tr></thead>
      <tbody>${rows.slice(0,25).map(({p,v,inv,total})=>`
        <tr>
          <td data-l="Загвар"><div class="rowflex"><img class="thumb" src="${p.image}" alt="">${p.name}</div></td>
          <td data-l="Хувилбар">${Object.values(v.options).join(' / ')}</td>
          ${BRANCHES.map(b=>`<td class="num" data-l="${b.name}">${inv[b.id]??0}</td>`).join('')}
          <td class="num" data-l="Нийт">${total}</td>
          <td data-l="Төлөв">${total===0
            ? '<span class="pill cancel">Дууссан</span>'
            : total<=2 ? '<span class="pill pending">Дуусах дөхсөн</span>' : ''}</td>
        </tr>`).join('')}</tbody>
    </table>
    <div class="note">Дэлгүүрт «Дууссан» хувилбар автоматаар харагдахгүй болно. Хэрэглэгч захиалаад
      дараа нь «уучлаарай, байхгүй байна» гэж хэлэх шаардлагагүй.</div>
  `;
}

render();
</script>
