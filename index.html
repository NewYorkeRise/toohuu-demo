<title>TOOHUU — Монгол эсгий урлал</title>
<meta name="description" content="TOOHUU эсгий загварын үнэ, захиалах заавар, хүргэлт, үйлдвэр болон дэлгүүрийн хаяг. Утас: 80200080, 88290080.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;600&family=Golos+Text:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#34312D; --ink-2:#776B5D; --ink-3:#867968;
    --paper:#F8F5EF; --card:#F8F5EF; --line:#DED4C5;
    --signal:#8A6A36; --signal-soft:#EFE7D9; --gold:#B99B68;
    --ok:#0F6B45; --ok-soft:#DFF0E7;
    --warn:#A65B10; --warn-soft:#F9EBD8;
    --stop:#A82121; --stop-soft:#F8E5E5;
    --on-ink:#fff; --subtle:#F0EBE3; --img:#ECE8E0; --bar:rgba(248,245,239,.96);
    --hot-bg:#2B1A12; --hot-fg:#F6C89A; --ticket:#171614;
    color-scheme: light;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  /* layout scale: --gut = side margin, --maxw = content width (set per device below) */
  :root{--gut:15px;--maxw:100%}
  body{font-family:'Golos Text',system-ui,sans-serif;background:var(--card);color:var(--ink);
       -webkit-font-smoothing:antialiased}
  .phone{min-height:100dvh;display:flex;flex-direction:column;background:var(--card)}

  header{position:sticky;top:0;z-index:20;background:var(--card);border-bottom:1px solid var(--line);
         display:flex;align-items:center;gap:11px;
         padding:12px max(var(--gut), calc((100% - var(--maxw)) / 2)) 11px;
         padding-top:max(12px, env(safe-area-inset-top))}
  .mark{width:46px;display:grid;place-items:center;flex:none}
  .mark img{width:100%;height:auto;display:block}
  .shop{font-family:'Unbounded';font-size:16px;letter-spacing:1.6px}
  .sub{font-size:11.5px;color:var(--ink-3);margin-top:1px}
  .live{margin-left:auto;font-size:11px;font-weight:600;letter-spacing:.5px;color:#9E1B1B;
        background:var(--stop-soft);border-radius:999px;padding:5px 9px;display:flex;align-items:center;gap:5px}
  .dot{width:6px;height:6px;border-radius:50%;background:#CE2020;animation:blink 1.4s infinite}
  @keyframes blink{50%{opacity:.25}}
  @media (prefers-reduced-motion:reduce){.dot{animation:none}}

  main{flex:1;width:100%;max-width:calc(var(--maxw) + 2 * var(--gut));margin:0 auto;padding:16px var(--gut) 28px}
  .eyebrow{font-size:10.5px;letter-spacing:1.5px;text-transform:uppercase;color:var(--ink-3);margin-bottom:10px}
  .back{background:none;border:none;font:inherit;color:var(--ink-2);font-size:13px;cursor:pointer;
        padding:0 0 12px;display:block}

  .grid{display:grid;grid-template-columns:1fr 1fr;gap:11px}
  .card{border:1px solid var(--line);border-radius:14px;overflow:hidden;cursor:pointer;background:var(--card);
        text-align:left;padding:0;font:inherit;color:inherit;display:block}
  .card:hover{border-color:var(--ink-3)}
  .card:focus-visible{outline:2px solid var(--signal);outline-offset:2px}
  .ph{aspect-ratio:1;width:100%;object-fit:cover;display:block;background:var(--img)}
  .cb{padding:9px 10px 11px}
  .cn{font-size:12.5px;font-weight:500;line-height:1.3}
  .cp{font-family:'Unbounded';font-size:12.5px;margin-top:5px}
  .tag{display:inline-block;font-size:10px;font-weight:600;padding:2px 6px;border-radius:5px;margin-top:6px}
  .tag.pre{background:var(--warn-soft);color:var(--warn)}
  .tag.low{background:var(--stop-soft);color:var(--stop)}
  .tag.ok{background:var(--ok-soft);color:var(--ok)}
  .tabs{display:flex;gap:7px;overflow-x:auto;padding-bottom:10px;margin-bottom:4px;scrollbar-width:none}
  .tabs::-webkit-scrollbar{display:none}
  .tabs button{flex:none;border:1px solid var(--line);background:var(--card);border-radius:999px;
    padding:8px 13px;font:inherit;font-size:12.5px;cursor:pointer;color:var(--ink);white-space:nowrap}
  .tabs button[aria-pressed="true"]{background:var(--ink);color:var(--on-ink);border-color:var(--ink)}
  .tabs button:focus-visible{outline:2px solid var(--signal);outline-offset:2px}
  .tabs em{font-style:normal;opacity:.5;margin-left:5px;font-size:11.5px}
  .flags{position:absolute;top:8px;left:8px;display:flex;gap:5px}
  .flags .tag{margin:0;box-shadow:0 1px 3px rgba(0,0,0,.12)}
  .tag.hot{background:var(--hot-bg);color:var(--hot-fg)}
  .tag.new{background:var(--signal);color:#fff}

  .gal{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin-bottom:14px}
  .gal img{width:72%;flex:none;aspect-ratio:1;object-fit:cover;border-radius:14px;background:var(--img)}
  h2{font-family:'Unbounded';font-size:19px;font-weight:400;letter-spacing:-.3px}
  .desc{font-size:13px;color:var(--ink-2);line-height:1.55;margin-top:6px}
  .big{font-family:'Unbounded';font-size:22px;margin-top:12px}
  .axis{font-size:10.5px;letter-spacing:1.4px;text-transform:uppercase;color:var(--ink-3);margin:16px 0 8px}
  .opts{display:flex;flex-wrap:wrap;gap:7px}
  .opt{border:1px solid var(--line);background:var(--card);border-radius:9px;padding:8px 13px;font:inherit;
       font-size:13px;cursor:pointer;color:var(--ink)}
  .opt[aria-pressed="true"]{border-color:var(--ink);background:var(--ink);color:var(--on-ink)}
  .opt:disabled{opacity:.32;cursor:not-allowed;text-decoration:line-through}
  .opt:focus-visible{outline:2px solid var(--signal);outline-offset:2px}
  .stockline{font-size:12.5px;margin-top:12px;padding:9px 11px;border-radius:9px;line-height:1.5}
  .stockline.ok{background:var(--ok-soft);color:var(--ok)}
  .stockline.pre{background:var(--warn-soft);color:var(--warn)}
  .stockline.no{background:var(--stop-soft);color:var(--stop)}

  .btn{width:100%;border:none;border-radius:12px;padding:15px;font:inherit;font-size:15px;font-weight:600;
       background:var(--ink);color:var(--on-ink);cursor:pointer;margin-top:16px}
  .btn:disabled{background:var(--line);color:var(--ink-3);cursor:not-allowed}
  .btn.signal{background:var(--signal);color:#fff}
  .btn.ghost{background:none;border:1px solid var(--line);color:var(--ink);font-weight:500}
  .btn:focus-visible{outline:2px solid var(--signal);outline-offset:2px}

  .line{display:flex;gap:11px;padding:12px 0;border-bottom:1px solid var(--line);align-items:center}
  .line img{width:48px;height:48px;border-radius:9px;object-fit:cover;flex:none;background:var(--img)}
  .ln{font-size:13px;font-weight:500}
  .lm{font-size:12px;color:var(--ink-3);margin-top:2px}
  .lt{margin-left:auto;font-family:'Unbounded';font-size:13px;white-space:nowrap}
  .rm{background:none;border:none;color:var(--ink-3);font-size:18px;cursor:pointer;padding:0 0 0 4px;line-height:1}
  .row{display:flex;justify-content:space-between;align-items:baseline;padding:4px 0;font-size:13px;color:var(--ink-2)}
  .row.total{padding-top:12px;margin-top:6px;border-top:1px solid var(--line)}
  .row.total b{font-family:'Unbounded';font-size:21px;color:var(--ink);font-weight:400}

  .seg{display:flex;gap:8px;margin-bottom:4px}
  .seg button{flex:1;border:1px solid var(--line);background:var(--card);border-radius:11px;padding:12px 8px;
              font:inherit;font-size:13px;cursor:pointer;color:var(--ink);line-height:1.35}
  .seg button[aria-pressed="true"]{border-color:var(--ink);background:var(--ink);color:var(--on-ink)}
  .seg small{display:block;font-size:11px;opacity:.7;margin-top:2px}
  .branch{display:flex;align-items:flex-start;gap:9px;border:1px solid var(--line);border-radius:11px;
          padding:11px 12px;font:inherit;font-size:13px;background:var(--card);cursor:pointer;color:var(--ink);
          text-align:left;width:100%;margin-top:8px;line-height:1.4}
  .branch[aria-pressed="true"]{border-color:var(--ink)}
  .branch small{display:block;color:var(--ink-3);font-size:11.5px;margin-top:2px}
  .branch .pipq{margin-left:auto;font-size:11px;white-space:nowrap;padding:2px 6px;border-radius:5px}

  label{display:block;font-size:10.5px;letter-spacing:1.4px;text-transform:uppercase;color:var(--ink-3);margin:14px 0 6px}
  input,textarea{width:100%;border:1px solid var(--line);border-radius:11px;padding:13px;font:inherit;
                 font-size:15px;background:var(--card);color:var(--ink);resize:none}
  input:focus,textarea:focus{outline:none;border-color:var(--signal)}
  .err{font-size:12.5px;color:var(--stop);margin-top:8px;min-height:17px;line-height:1.4}

  .qr{width:168px;height:168px;margin:16px auto;border-radius:14px;background:
      repeating-linear-gradient(90deg,var(--ink) 0 8px,transparent 8px 16px),
      repeating-linear-gradient(0deg,var(--ink) 0 8px,transparent 8px 16px);
      background-color:#fff;border:8px solid #fff;box-shadow:0 0 0 1px var(--line)}
  .banks{display:flex;flex-direction:column;gap:8px}
  .bank{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:11px;padding:12px 13px;
        font:inherit;font-size:14px;background:var(--card);cursor:pointer;color:var(--ink);text-align:left}
  .bank:hover{border-color:var(--ink-3)}
  .bm{width:26px;height:26px;border-radius:7px;flex:none}
  .poll{font-size:12px;color:var(--ink-3);margin-top:14px;display:flex;align-items:center;justify-content:center;gap:7px}
  .spin{width:11px;height:11px;border:2px solid var(--line);border-top-color:var(--signal);border-radius:50%;
        animation:sp .8s linear infinite}
  @keyframes sp{to{transform:rotate(360deg)}}

  .ticket{background:var(--ticket);color:#fff;box-shadow:0 0 0 1px var(--line);border-radius:16px;padding:20px 18px;position:relative}
  .ticket:after{content:"";position:absolute;left:0;right:0;top:118px;height:1px;
    background:repeating-linear-gradient(90deg,rgba(255,255,255,.4) 0 5px,transparent 5px 10px)}
  .tst{font-size:10.5px;letter-spacing:1.5px;text-transform:uppercase;color:#6FDCA9}
  .tno{font-family:'Unbounded';font-size:25px;letter-spacing:1px;margin:8px 0 3px}
  .thint{font-size:12px;color:#9C978D;line-height:1.5}
  .trow{display:flex;justify-content:space-between;font-size:13px;padding:3px 0;color:#C6C1B8;gap:12px}

  if(!/^[5-9]\d{7}$/.test(d)) throw new Error('Утасны дугаар буруу байна. 8 оронтой, 5–9-өөр эхэлсэн байх ёстой.');
  return d;
};
const label = (p,v) => `${p.name} (${p.option_axes.map(a=>v.options[a.name]).join(' / ')})`;

function selectionLines(){
  return cart.map(l => {
    const p = CATALOG.find(x=>x.id===l.product_id);
    const v = p?.variants.find(x=>x.id===l.variant_id);
    if(!p || !v || !Number.isInteger(l.qty) || l.qty < 1) throw new Error('Сонгосон бараагаа дахин шалгана уу.');
    return {name:label(p,v), img:p.images[0], qty:l.qty, unit:unitOf(p), price:p.base_price};
  });
}

async function copyAccount(){
  const status=document.getElementById('account-copy-status');
  try{ await navigator.clipboard.writeText(BUSINESS.account); status.textContent='Дансны дугаар хууллаа.'; }
  catch{ status.textContent='Автоматаар хуулж чадсангүй. Дансны дугаарыг сонгоод хуулна уу.'; }
}

function renderNav(){
  const n = cart.reduce((s,l)=>s+l.qty,0);
  const top = document.getElementById('tnav');            // laptop / desktop
  if (top) top.innerHTML = NAV.map(([k,label,views]) => {
    const here = views.includes(view.name);
    return `<button data-nav="${k}" onclick="navTo('${k}')" ${here?'aria-current="page"':''} aria-label="${label}${k==='cart'&&n?`, ${n} бараа`:''}">
      <svg viewBox="0 0 24 24" aria-hidden="true">${NAV_ICONS[k]}</svg><span>${label}</span>${
      k==='cart' && n ? `<span class="bb" aria-hidden="true">${n>99?'99+':n}</span>` : ''}</button>`;
  }).join('');
  const el = document.getElementById('bnav');             // phone / tablet
  if (!el) return;
  el.innerHTML = NAV.map(([k,label,views]) => {
    const here = views.includes(view.name);
    const badge = k==='cart' && n ? `<span class="bb">${n>99?'99+':n}</span>` : '';
    return `<button onclick="navTo('${k}')" ${here?'aria-current="page"':''} aria-label="${label}${k==='cart'&&n?`, ${n} бараа`:''}">
      <svg viewBox="0 0 24 24" aria-hidden="true">${NAV_ICONS[k]}</svg>${badge}<span>${label}</span></button>`;
  }).join('');
}
function navTo(k){
  const item = NAV.find(x => x[0] === k);
  if (!item) return;
  go(item[3]());
  window.scrollTo(0, 0);
}

// OR within a group, AND between groups. Axis selections must coexist on one variant.
const COLOR_SWATCHES = {'Хар':'#242321','Бор':'#886344','Саарал':'#A3A09B','Цагаан':'#F7F4EC'};
const CATALOG_GROUPS = [
  {key:'type',label:'Ангилал',values:Object.entries(TYPES).map(([value,t])=>({value,label:t.label})),test:(p,v)=>p.type===v},
  {key:'model',label:'Загварын нэр',values:CATALOG.map(p=>({value:p.id,label:p.name})),test:(p,v)=>p.id===v},
  ...['Хэмжээ','Өнгө','Хийцлэл','Загвар'].map((axis,i)=>({key:'axis'+i,axis,label:axis==='Загвар'?'Хээ':axis,
    values:[...new Set(CATALOG.flatMap(p=>p.variants.map(v=>v.options[axis]).filter(Boolean)))].sort((a,b)=>a.localeCompare(b,'mn',{numeric:true})).map(value=>({value,label:value}))})),
  {key:'category',label:'Насны ангилал',values:[{value:'main',label:'Үндсэн'},{value:'kids',label:'Хүүхдийн'}],test:(p,v)=>p.category===v},
  {key:'price',label:'Үнэ',values:[{value:'under100',label:'100,000₮ хүртэл'},{value:'100to250',label:'100,000–250,000₮'},{value:'over250',label:'250,000₮-өөс дээш'}],
    test:(p,v)=>v==='under100'?p.base_price<=100000:v==='100to250'?p.base_price>100000&&p.base_price<=250000:p.base_price>250000},
  {key:'collection',label:'Онцлох',values:[{value:'hot',label:'Эрэлттэй'},{value:'fresh',label:'Шинэ'}],test:(p,v)=>Boolean(p[v])},
  {key:'stock',label:'Бэлэн байдал',values:[{value:'available',label:'Бэлэн байгаа'}],test:p=>p.stock_count>0},
];
let catalogFilters={query:'',sort:'default',selected:{}}, filterPanelOpen=false;

function matchingCatalogVariants(p){
  return p.variants.filter(v=>CATALOG_GROUPS.filter(g=>g.axis).every(g=>{
    const chosen=catalogFilters.selected[g.key]||[];
    return !chosen.length||chosen.includes(v.options[g.axis]);
  }));
}

function filteredCatalog(){
  const query=catalogFilters.query.trim().toLocaleLowerCase('mn');
  const shown=CATALOG.filter(p=>p.name.toLocaleLowerCase('mn').includes(query)&&
    CATALOG_GROUPS.filter(g=>!g.axis).every(g=>{
      const chosen=catalogFilters.selected[g.key]||[];
      return !chosen.length||chosen.some(value=>g.test(p,value));
    })&&matchingCatalogVariants(p).length>0);
  if(catalogFilters.sort==='price-asc') shown.sort((a,b)=>a.base_price-b.base_price);
  if(catalogFilters.sort==='price-desc') shown.sort((a,b)=>b.base_price-a.base_price);
  if(catalogFilters.sort==='name') shown.sort((a,b)=>a.name.localeCompare(b.name,'mn'));
  return shown;
}

function updateCatalogResults(){
  const shown=filteredCatalog(), chips=[];
  CATALOG_GROUPS.forEach((g,i)=>g.values.forEach((v,j)=>{
    const active=(catalogFilters.selected[g.key]||[]).includes(v.value);
    document.getElementById(`filter-${i}-${j}`).setAttribute('aria-pressed',String(active));
    if(active) chips.push(`<button class="active-filter" aria-label="${esc(g.label+': '+v.label)} арилгах" onclick="toggleCatalogFilter(${i},${j})">${esc(v.label)} <span aria-hidden="true">×</span></button>`);
  }));
  if(catalogFilters.query.trim()) chips.push(`<button class="active-filter" onclick="clearCatalogQuery()" aria-label="Хайлтыг арилгах">Хайлт: ${esc(catalogFilters.query.trim())} <span aria-hidden="true">×</span></button>`);
  document.getElementById('filter-summary').textContent=`${chips.length?chips.length+' сонголт · ':''}${filterPanelOpen?'Хураах −':'Нээх +'}`;
  document.getElementById('filter-reset').disabled=!chips.length;
  document.getElementById('catalog-count').textContent=`${shown.length} загвар`;
  document.getElementById('active-filter-bar').classList.toggle('has-filters',chips.length>0);
  document.getElementById('filter-apply').textContent=`${shown.length} загвар харах`;
  const chipBox=document.getElementById('active-filters');
  const chipHadFocus=chipBox.contains(document.activeElement);
  chipBox.innerHTML=chips.join('');
  if(chipHadFocus){
    const next=chipBox.querySelector('button')||catalogFocusTarget();
    next.focus({preventScroll:true});
  }
  const sections=catalogFilters.sort==='default'
    ? Object.keys(TYPES).map(type=>({label:type==='boot'?'TOOHUU · Эсгий урлал':TYPES[type].label,products:shown.filter(p=>p.type===type)})).filter(s=>s.products.length)
    : [{label:'Бүх загвар',products:shown}];
  document.getElementById('catalog-results').innerHTML=shown.length?sections.map((section,index)=>`
    <section class="collection-section" aria-label="${esc(section.label)}">
      <div class="collection-heading"><div><h2>${section.label}</h2>${index===0?`<p class="catalog-note">${CATALOG_NOTE}</p>`:''}</div><span>${section.products.length} загвар</span></div>
      <div class="grid">${section.products.map(p=>{
      const flags = [
        p.hot   ? '<span class="tag hot">Эрэлттэй</span>' : '',
        p.fresh ? '<span class="tag new">Шинэ</span>' : '',
      ].join('');
      return `<button class="card" onclick="openCatalogModel('${p.id}')">
        <div class="card-media">
          <img class="ph" src="${p.images[0]}" alt="" loading="lazy" onerror="${imgFallback}">
          ${flags ? `<div class="flags">${flags}</div>` : ''}
        </div>
        <div class="cb"><div class="card-title-row"><div class="cn">${p.name}</div>
          <div class="cp">${mnt(p.base_price)}</div></div>
          <div class="card-stock">Бэлэн: ${p.stock_count} ${unitOf(p)}</div>
        </div></button>`;
    }).join('')}</div></section>`).join(''):`<div class="catalog-empty"><strong>Тохирох загвар олдсонгүй</strong>
      <p>Хэмжээ, өнгө эсвэл бусад сонголтоо өөрчилж үзээрэй.</p><button class="btn" onclick="resetCatalogFilters()">Бүх загварыг харах</button></div>`;
  reveal();
}

function toggleCatalogFilter(groupIndex,valueIndex){
  const group=CATALOG_GROUPS[groupIndex], value=group.values[valueIndex].value;
  const chosen=catalogFilters.selected[group.key]||[];
  catalogFilters.selected[group.key]=chosen.includes(value)?chosen.filter(v=>v!==value):[...chosen,value];
  updateCatalogResults();
}
function setCatalogQuery(value){catalogFilters.query=value;updateCatalogResults()}
function clearCatalogQuery(){document.getElementById('catalog-search').value='';setCatalogQuery('')}
function catalogFocusTarget(){
  return document.getElementById(!filterPanelOpen&&matchMedia('(max-width:1023px)').matches?'filter-toggle':'catalog-search');
}
function resetCatalogFilters(){
  catalogFilters.selected={};
  clearCatalogQuery();
  catalogFocusTarget().focus({preventScroll:true});
}
function toggleFilterPanel(){
  filterPanelOpen=!filterPanelOpen;
  document.querySelector('.catalog-sidebar').classList.toggle('is-open',filterPanelOpen);
  document.getElementById('filter-toggle').setAttribute('aria-expanded',String(filterPanelOpen));
  updateCatalogResults();
}
function showCatalogResults(){
  if(filterPanelOpen) toggleFilterPanel();
  document.getElementById('filter-toggle').focus({preventScroll:true});
  document.querySelector('.catalog-main').scrollIntoView({block:'start'});
}
function openCatalogModel(id){
  const p=CATALOG.find(x=>x.id===id), options={};
  const matches=matchingCatalogVariants(p);
  CATALOG_GROUPS.filter(g=>g.axis).forEach(g=>{
    const chosen=catalogFilters.selected[g.key]||[];
    if(chosen.length===1&&matches.some(v=>v.options[g.axis]===chosen[0])) options[g.axis]=chosen[0];
  });
  go({name:'model',id,options});
  window.scrollTo(0,0);
}

// After each choice, re-check which values still lead to a real pair.
function refreshOptions(p){
  p.option_axes.forEach((axis, i) => {
    const box = document.querySelector(`.opts[data-axis="${axis.name}"]`);
    axis.values.forEach((val, j) => {
      const btn = box.children[j];
      const probe = {...sel, [axis.name]: val};
      const reachable = p.variants.some(v =>
        p.option_axes.every(a => probe[a.name] === undefined || v.options[a.name] === probe[a.name])
      );
      btn.disabled = !reachable;
      btn.setAttribute('aria-pressed', String(sel[axis.name] === val));
    });
  });

  const box = document.getElementById('stock');
  const done = p.option_axes.every(a => sel[a.name]);
  if(!done){
    const missing = p.option_axes.filter(a=>!sel[a.name]).map(a=>a.name);
    box.innerHTML = `<div class="stockline pre">Сонгоно уу: ${missing.join(', ')}</div>`;
    return;
  }
  box.innerHTML = '';
}

function pickOpt(pid, axis, el){
  const p = CATALOG.find(x=>x.id===pid);
  sel[axis] = sel[axis] === el.textContent ? undefined : el.textContent;
  if(sel[axis] === undefined) delete sel[axis];
  refreshOptions(p);
  document.getElementById('perr').textContent = '';
}

function addToCart(pid){
  const p = CATALOG.find(x=>x.id===pid);
  const e = document.getElementById('perr');
  const missing = p.option_axes.filter(a=>!sel[a.name]).map(a=>a.name);
  if(missing.length){ e.textContent = `Сонгоогүй: ${missing.join(', ')}`; return; }
  const v = p.variants.find(x => p.option_axes.every(a => x.options[a.name] === sel[a.name]));
  if(!v){ e.textContent = 'Энэ хослол байхгүй байна.'; return; }
  const i = cart.findIndex(l=>l.variant_id===v.id);
  if(i>=0) cart[i].qty++; else cart.push({product_id:p.id, variant_id:v.id, qty:1});
  go({name:'cart'});
}

function cartView(){
  const lines=selectionLines();
  app.innerHTML = `
    <button class="back" onclick="navTo('shop')">← Дэлгүүр</button><h2>Таны сонгосон бараа</h2>
    ${lines.length ? lines.map((l,i)=>`
      <div class="line"><img src="${l.img}" alt="" onerror="${imgFallback}">
        <div><div class="ln">${esc(l.name)}</div><div class="lm">${mnt(l.price)} / ${l.unit}</div></div>
        <span class="selection-count">${l.qty} ${l.unit}</span>
        <button class="rm" aria-label="${esc(l.name)} хасах" onclick="cart.splice(${i},1);render()">×</button></div>`).join('')
      : '<p class="empty">Сагс хоосон байна. Таалагдсан загвараа сонгоорой.</p>'}
    ${lines.length ? `
      <div class="row"><span>Барааны урьдчилсан дүн</span><b>${mnt(lines.reduce((sum,l)=>sum+l.price*l.qty,0))}</b></div>
      <p class="desc">${CATALOG_NOTE} Хүргэлтийн төлбөр тусдаа.</p>
      <div class="axis">Хүлээн авах</div>
      <div class="seg">
        <button aria-pressed="${method==='delivery'}" onclick="setMethod('delivery')">Хүргэлтээр<small>Хотод 8,000–10,000₮</small></button>
        <button aria-pressed="${method==='pickup'}" onclick="setMethod('pickup')">Өөрөө очиж авах<small>Үйлдвэр / дэлгүүр</small></button>
      </div>
      ${method==='pickup' ? BRANCHES.map(b=>`<button class="branch" aria-pressed="${branch===b.id}" onclick="setBranch('${b.id}')"><div><b>${b.name}</b><small>${b.address}</small></div></button>`).join('')
        : `<p class="desc">${BUSINESS.delivery} ${BUSINESS.rural}</p>`}
      <div class="note">Сонгосон загварын зураг, размер, өнгөө чатаар илгээж эцсийн үнэ болон бэлэн байгаа эсэхийг баталгаажуулаарай. Дараа нь барааны үнийн 50%-ийг урьдчилгаа болгон шилжүүлнэ.</div>
      <button class="btn signal" onclick="go({name:'check'})" ${method==='pickup'&&!branch?'disabled':''}>Чатаар захиалах мэдээллээ бэлдэх</button>` : ''}
    <button class="btn ghost" onclick="navTo('orders')">Захиалга, төлбөр, хүргэлтийн заавар</button>`;
}
const setMethod = m => { method=m; if(m==='delivery') branch=null; render(); };
const setBranch = b => { branch = branch===b ? null : b; render(); };

function checkView(){
  if(!cart.length || (method==='pickup'&&!branch)){ go({name:'cart'}); return; }
  app.innerHTML = `
    <button class="back" onclick="go({name:'cart'})">← Сагс</button><h2>Захиалгын мэдээлэл</h2>
    <p class="desc">Мэдээллээ бэлдээд чатаар илгээнэ үү. Энэ маягт захиалгыг автоматаар илгээхгүй.</p>
    <label for="nm">Нэр</label><input id="nm" autocomplete="name" placeholder="Овог нэр">
    <label for="ph">Утас</label><input id="ph" type="tel" autocomplete="tel" placeholder="80200080">
    ${method==='delivery' ? `<label for="ad">Гэрийн хаяг / орон нутгийн чиглэл</label><textarea id="ad" autocomplete="street-address" rows="3" placeholder="Дүүрэг, хороо, байр, тоот эсвэл аймаг, сум"></textarea>`
      : `<div class="note">Очих газар: ${BRANCHES.find(b=>b.id===branch).name} — ${BRANCHES.find(b=>b.id===branch).address}</div>`}
    <div class="err" id="cerr" role="alert"></div>
    <button class="btn signal" onclick="prepareRequest()">Чатад илгээх текст бэлдэх</button>`;
}

function prepareRequest(){
  const e=document.getElementById('cerr');
  const name=document.getElementById('nm').value.trim();
  let ph, addr='';
  try{
    if(name.length<2) throw new Error('Нэрээ оруулна уу.');
    ph=phone(document.getElementById('ph').value);
    if(method==='delivery'){
      addr=document.getElementById('ad').value.trim();
      if(addr.length<8) throw new Error('Хаяг эсвэл орон нутгийн чиглэлээ бүтэн оруулна уу.');
    }
    order={name,phone:ph,addr,method,branch,lines:selectionLines()};
    go({name:'request'});
  }catch(err){ e.textContent=err.message; }
}

function requestText(){
  const place=BRANCHES.find(b=>b.id===order.branch);
  return ['Сайн байна уу? Дараах барааг захиалах хүсэлтэй байна.',
    ...order.lines.map(l=>`${l.name} — ${l.qty} ${l.unit}, жишиг үнэ ${mnt(l.price)} / ${l.unit}${l.img.startsWith('https://')?'\nЗураг: '+l.img:''}`),
    `Нэр: ${order.name}`, `Утас: ${order.phone}`,
    order.method==='pickup'?`Өөрөө очиж авах: ${place.name} — ${place.address}`:`Хаяг / чиглэл: ${order.addr}`,
    'Эцсийн үнэ, бэлэн байгаа эсэх болон захиалгын хугацааг баталгаажуулж өгнө үү.'
  ].join('\n\n');
}

function requestView(){
  if(!order){ go({name:'cart'}); return; }
  app.innerHTML = `<button class="back" onclick="go({name:'cart'})">← Сагс</button>
    <h2>Мэдээллээ чатаар илгээнэ үү</h2>
    <p class="desc">Доорх текстийг хуулж Messenger чатад илгээгээд сонирхсон загварынхаа зургийг хавсаргаарай.</p>
    <label for="order-draft">Захиалгын хүсэлт</label>
    <textarea id="order-draft" readonly rows="12">${esc(requestText())}</textarea>
    <button class="btn" onclick="copyRequest()">Захиалгын текст хуулах</button>
    <div class="copy-status" id="request-copy-status" role="status"></div>
    <a class="btn signal" href="${BUSINESS.messenger}" target="_blank" rel="noopener">Messenger нээх</a>
    <div class="note">Захиалга хараахан илгээгдээгүй. Чатаар загвар, үнийг тохиролцож, 50% урьдчилгаа төлсний дараа захиалга баталгаажна.</div>
    <button class="btn ghost" onclick="navTo('orders')">Төлбөрийн данс, захиалгын нөхцөл</button>`;
}

async function copyRequest(){
  const status=document.getElementById('request-copy-status');
  try{ await navigator.clipboard.writeText(requestText()); status.textContent='Текст хууллаа. Messenger чатад буулгаж илгээнэ үү.'; }
  catch{ document.getElementById('order-draft').select(); status.textContent='Текстийг сонголоо. Өөрөө хуулж чатад илгээнэ үү.'; }
}

// ── entrance animation ────────────────────────────────────────────
let cardObserver=null;
const reveal = () => {
  if(cardObserver) cardObserver.disconnect();
  const cards = [...document.querySelectorAll('.card')];
  if (!('IntersectionObserver' in window) ||
      matchMedia('(prefers-reduced-motion: reduce)').matches) {
    cards.forEach(c => c.classList.add('in'));
    return;
  }
  const io = new IntersectionObserver((entries, obs) => {
    entries.forEach(e => {
      if (!e.isIntersecting) return;
      const i = cards.indexOf(e.target);
      // stagger by position in the row, so pairs rise together
      e.target.style.transitionDelay = `${(i % 6) * 55}ms`;
      e.target.classList.add('in');
      obs.unobserve(e.target);
    });
  }, { rootMargin: '0px 0px -8% 0px', threshold: 0.08 });
  cardObserver=io;
  cards.forEach(c => io.observe(c));
};

// ── gallery dots ──────────────────────────────────────────────────
function syncDots(){
  const g = document.getElementById('gal'), d = document.getElementById('dots');
  if(!g || !d) return;
  const i = Math.round(g.scrollLeft / (g.scrollWidth / g.children.length));
  [...d.children].forEach((el,j)=>el.classList.toggle('on', j===Math.min(i, d.children.length-1)));
}

// ── fullscreen viewer ─────────────────────────────────────────────
let lbEl = null;

function openLb(pid, index){
  const p = CATALOG.find(x=>x.id===pid);
  closeLb();
  lbEl = document.createElement('div');
  lbEl.className = 'lb';
  lbEl.innerHTML = `
    <div class="lb-top">
      <span class="lb-count" id="lbc">${index+1} / ${p.images.length}</span>
      <button class="lb-x" aria-label="Хаах" onclick="closeLb()">×</button>
    </div>
    <div class="lb-track" id="lbt" onscroll="lbSync(${p.images.length})">
      ${p.images.map(u=>`<div class="lb-slide"><img src="${u}" alt="${p.name}" onerror="${imgFallback}"
         onclick="this.classList.toggle('zoomed')"></div>`).join('')}
    </div>
    <div class="lb-bot" id="lbb">
      ${p.images.map((u,i)=>`<button aria-current="${i===index}" onclick="lbGo(${i})">
        <img src="${u}" alt="" onerror="${imgFallback}"></button>`).join('')}
    </div>`;
  document.body.appendChild(lbEl);
  document.body.style.overflow = 'hidden';
  requestAnimationFrame(()=>{
    lbEl.classList.add('open');
    lbGo(index, false);
  });
  document.addEventListener('keydown', lbKeys);
}

function lbGo(i, smooth = true){
  const t = document.getElementById('lbt');
  if(!t) return;
  t.scrollTo({ left: i * t.clientWidth, behavior: smooth ? 'smooth' : 'auto' });
}

function lbSync(n){
  const t = document.getElementById('lbt');
  if(!t) return;
  const i = Math.min(Math.round(t.scrollLeft / t.clientWidth), n-1);
  document.getElementById('lbc').textContent = `${i+1} / ${n}`;
  [...document.getElementById('lbb').children].forEach((b,j)=>b.setAttribute('aria-current', String(j===i)));
  // a zoomed image that scrolls away should reset, or the next one opens mid-zoom
  [...t.children].forEach((s,j)=>{ if(j!==i) s.firstElementChild.classList.remove('zoomed'); });
}

function lbKeys(e){
  if(e.key === 'Escape') closeLb();
  const t = document.getElementById('lbt');
  if(!t) return;
  const i = Math.round(t.scrollLeft / t.clientWidth);
  if(e.key === 'ArrowRight') lbGo(i+1);
  if(e.key === 'ArrowLeft')  lbGo(Math.max(i-1, 0));
}

function closeLb(){
  if(!lbEl) return;
  const el = lbEl; lbEl = null;
  el.classList.remove('open');
  document.body.style.overflow = '';
  document.removeEventListener('keydown', lbKeys);
  setTimeout(()=>el.remove(), 280);
}

render();
</script>
