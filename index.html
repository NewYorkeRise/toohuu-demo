<title>TOOHUU — бренд</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;600&family=Golos+Text:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#171614; --ink-2:#57534C; --ink-3:#928C82;
    --paper:#EDEAE4; --card:#FFF; --line:#DDD8CF;
    --signal:#1E4FE0; --signal-soft:#E8ECFC;
    --ok:#0F6B45; --ok-soft:#DFF0E7;
    --warn:#A65B10; --warn-soft:#F9EBD8;
    --stop:#A82121; --stop-soft:#F8E5E5;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Golos Text',system-ui,sans-serif;background:var(--paper);color:var(--ink);
       -webkit-font-smoothing:antialiased;display:flex;justify-content:center;padding:22px 12px 56px}
  .phone{width:100%;max-width:430px;background:var(--card);border:1px solid var(--line);
         border-radius:26px;overflow:hidden;display:flex;flex-direction:column;min-height:760px}

  header{padding:15px 18px 13px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:11px}
  .mark{width:46px;display:grid;place-items:center;flex:none}
  .mark img{width:100%;height:auto;display:block}
  .shop{font-family:'Unbounded';font-size:16px;letter-spacing:1.6px}
  .sub{font-size:11.5px;color:var(--ink-3);margin-top:1px}
  .live{margin-left:auto;font-size:11px;font-weight:600;letter-spacing:.5px;color:#9E1B1B;
        background:var(--stop-soft);border-radius:999px;padding:5px 9px;display:flex;align-items:center;gap:5px}
  .dot{width:6px;height:6px;border-radius:50%;background:#CE2020;animation:blink 1.4s infinite}
  @keyframes blink{50%{opacity:.25}}
  @media (prefers-reduced-motion:reduce){.dot{animation:none}}

  main{flex:1;padding:16px 18px 22px}
  .eyebrow{font-size:10.5px;letter-spacing:1.5px;text-transform:uppercase;color:var(--ink-3);margin-bottom:10px}
  .back{background:none;border:none;font:inherit;color:var(--ink-2);font-size:13px;cursor:pointer;
        padding:0 0 12px;display:block}

  .grid{display:grid;grid-template-columns:1fr 1fr;gap:11px}
  .card{border:1px solid var(--line);border-radius:14px;overflow:hidden;cursor:pointer;background:var(--card);
        text-align:left;padding:0;font:inherit;color:inherit;display:block}
  .card:hover{border-color:var(--ink-3)}
  .card:focus-visible{outline:2px solid var(--signal);outline-offset:2px}
  .ph{aspect-ratio:1;width:100%;object-fit:cover;display:block;background:#E4E0D8}
  .cb{padding:9px 10px 11px}
  .cn{font-size:12.5px;font-weight:500;line-height:1.3}
  .cp{font-family:'Unbounded';font-size:12.5px;margin-top:5px}
  .tag{display:inline-block;font-size:10px;font-weight:600;padding:2px 6px;border-radius:5px;margin-top:6px}
  .tag.pre{background:var(--warn-soft);color:var(--warn)}
  .tag.low{background:var(--stop-soft);color:var(--stop)}
  .tag.ok{background:var(--ok-soft);color:var(--ok)}
  .tabs{display:flex;gap:7px;overflow-x:auto;padding-bottom:10px;margin-bottom:4px;scrollbar-width:none}
  .tabs::-webkit-scrollbar{display:none}
  .tabs button{flex:none;border:1px solid var(--line);background:var(--card);border-radius:999px;
    padding:8px 13px;font:inherit;font-size:12.5px;cursor:pointer;color:var(--ink);white-space:nowrap}
  .tabs button[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}
  .tabs button:focus-visible{outline:2px solid var(--signal);outline-offset:2px}
  .tabs em{font-style:normal;opacity:.5;margin-left:5px;font-size:11.5px}
  .flags{position:absolute;top:8px;left:8px;display:flex;gap:5px}
  .flags .tag{margin:0;box-shadow:0 1px 3px rgba(0,0,0,.12)}
  .tag.hot{background:#2B1A12;color:#F6C89A}
  .tag.new{background:var(--signal);color:#fff}

  .gal{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin-bottom:14px}
  .gal img{width:72%;flex:none;aspect-ratio:1;object-fit:cover;border-radius:14px;background:#E4E0D8}
  h2{font-family:'Unbounded';font-size:19px;font-weight:400;letter-spacing:-.3px}
  .desc{font-size:13px;color:var(--ink-2);line-height:1.55;margin-top:6px}
  .big{font-family:'Unbounded';font-size:22px;margin-top:12px}
  .axis{font-size:10.5px;letter-spacing:1.4px;text-transform:uppercase;color:var(--ink-3);margin:16px 0 8px}
  .opts{display:flex;flex-wrap:wrap;gap:7px}
  .opt{border:1px solid var(--line);background:var(--card);border-radius:9px;padding:8px 13px;font:inherit;
       font-size:13px;cursor:pointer;color:var(--ink)}
  .opt[aria-pressed="true"]{border-color:var(--ink);background:var(--ink);color:#fff}
  .opt:disabled{opacity:.32;cursor:not-allowed;text-decoration:line-through}
  .opt:focus-visible{outline:2px solid var(--signal);outline-offset:2px}
  .stockline{font-size:12.5px;margin-top:12px;padding:9px 11px;border-radius:9px;line-height:1.5}
  .stockline.ok{background:var(--ok-soft);color:var(--ok)}
  .stockline.pre{background:var(--warn-soft);color:var(--warn)}
  .stockline.no{background:var(--stop-soft);color:var(--stop)}

  .btn{width:100%;border:none;border-radius:12px;padding:15px;font:inherit;font-size:15px;font-weight:600;
       background:var(--ink);color:#fff;cursor:pointer;margin-top:16px}
  .btn:disabled{background:var(--line);color:var(--ink-3);cursor:not-allowed}
  .btn.signal{background:var(--signal)}
  .btn.ghost{background:none;border:1px solid var(--line);color:var(--ink);font-weight:500}
  .btn:focus-visible{outline:2px solid var(--signal);outline-offset:2px}

  .line{display:flex;gap:11px;padding:12px 0;border-bottom:1px solid var(--line);align-items:center}
  .line img{width:48px;height:48px;border-radius:9px;object-fit:cover;flex:none;background:#E4E0D8}
  .ln{font-size:13px;font-weight:500}
  .lm{font-size:12px;color:var(--ink-3);margin-top:2px}
  .lt{margin-left:auto;font-family:'Unbounded';font-size:13px;white-space:nowrap}
  .rm{background:none;border:none;color:var(--ink-3);font-size:18px;cursor:pointer;padding:0 0 0 4px;line-height:1}
  .row{display:flex;justify-content:space-between;align-items:baseline;padding:4px 0;font-size:13px;color:var(--ink-2)}
  .row.total{padding-top:12px;margin-top:6px;border-top:1px solid var(--line)}
  .row.total b{font-family:'Unbounded';font-size:21px;color:var(--ink);font-weight:400}

  .seg{display:flex;gap:8px;margin-bottom:4px}
  .seg button{flex:1;border:1px solid var(--line);background:var(--card);border-radius:11px;padding:12px 8px;
              font:inherit;font-size:13px;cursor:pointer;color:var(--ink);line-height:1.35}
  .seg button[aria-pressed="true"]{border-color:var(--ink);background:var(--ink);color:#fff}
  .seg small{display:block;font-size:11px;opacity:.7;margin-top:2px}
  .branch{display:flex;align-items:flex-start;gap:9px;border:1px solid var(--line);border-radius:11px;
          padding:11px 12px;font:inherit;font-size:13px;background:var(--card);cursor:pointer;color:var(--ink);
          text-align:left;width:100%;margin-top:8px;line-height:1.4}
  .branch[aria-pressed="true"]{border-color:var(--ink)}
  .branch small{display:block;color:var(--ink-3);font-size:11.5px;margin-top:2px}
  .branch .pipq{margin-left:auto;font-size:11px;white-space:nowrap;padding:2px 6px;border-radius:5px}

  label{display:block;font-size:10.5px;letter-spacing:1.4px;text-transform:uppercase;color:var(--ink-3);margin:14px 0 6px}
  input,textarea{width:100%;border:1px solid var(--line);border-radius:11px;padding:13px;font:inherit;
                 font-size:15px;background:var(--card);color:var(--ink);resize:none}
  input:focus,textarea:focus{outline:none;border-color:var(--signal)}
  .err{font-size:12.5px;color:var(--stop);margin-top:8px;min-height:17px;line-height:1.4}

  .qr{width:168px;height:168px;margin:16px auto;border-radius:14px;background:
      repeating-linear-gradient(90deg,var(--ink) 0 8px,transparent 8px 16px),
      repeating-linear-gradient(0deg,var(--ink) 0 8px,transparent 8px 16px);
      background-color:#fff;border:8px solid #fff;box-shadow:0 0 0 1px var(--line)}
  .banks{display:flex;flex-direction:column;gap:8px}
  .bank{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:11px;padding:12px 13px;
        font:inherit;font-size:14px;background:var(--card);cursor:pointer;color:var(--ink);text-align:left}
  .bank:hover{border-color:var(--ink-3)}
  .bm{width:26px;height:26px;border-radius:7px;flex:none}
  .poll{font-size:12px;color:var(--ink-3);margin-top:14px;display:flex;align-items:center;justify-content:center;gap:7px}
  .spin{width:11px;height:11px;border:2px solid var(--line);border-top-color:var(--signal);border-radius:50%;
        animation:sp .8s linear infinite}
  @keyframes sp{to{transform:rotate(360deg)}}

  .ticket{background:var(--ink);color:#fff;border-radius:16px;padding:20px 18px;position:relative}
  .ticket:after{content:"";position:absolute;left:0;right:0;top:118px;height:1px;
    background:repeating-linear-gradient(90deg,rgba(255,255,255,.4) 0 5px,transparent 5px 10px)}
  .tst{font-size:10.5px;letter-spacing:1.5px;text-transform:uppercase;color:#6FDCA9}
  .tno{font-family:'Unbounded';font-size:25px;letter-spacing:1px;margin:8px 0 3px}
  .thint{font-size:12px;color:#9C978D;line-height:1.5}
  .trow{display:flex;justify-content:space-between;font-size:13px;padding:3px 0;color:#C6C1B8;gap:12px}
  .trow b{color:#fff;font-weight:500;white-space:nowrap}
  .steps{margin-top:16px}
  .step{display:flex;gap:11px;align-items:flex-start;font-size:13px;padding:7px 0;color:var(--ink-3)}
  .step.on{color:var(--ink)}
  .pip{width:9px;height:9px;border-radius:50%;background:var(--line);margin-top:4px;flex:none}
  .step.on .pip{background:var(--ok)}
  .note{font-size:11.5px;line-height:1.55;color:var(--ink-2);background:var(--signal-soft);border-radius:10px;
        padding:10px 12px;margin-top:14px}
  .footnote{max-width:430px;width:100%;margin:14px auto 0;font-size:12px;color:var(--ink-2);text-align:center;line-height:1.6}

  /* bottom menu — phones only; on desktop the page already shows everything */
  .bnav{display:none}
  .bnav button{position:relative;border:none;background:none;font:inherit;display:flex;flex-direction:column;
               align-items:center;gap:3px;padding:6px 2px 4px;color:var(--ink-3);font-size:10.5px;cursor:pointer;
               -webkit-tap-highlight-color:transparent}
  .bnav button[aria-current="page"]{color:var(--ink)}
  .bnav button[aria-current="page"] svg{stroke-width:2.1}
  .bnav svg{width:23px;height:23px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
  .bnav .bb{position:absolute;top:1px;left:calc(50% + 6px);min-width:17px;height:17px;padding:0 5px;border-radius:9px;
            background:var(--stop);color:#fff;font-size:10px;font-weight:600;line-height:17px;text-align:center}
  .bnav button:focus-visible{outline:2px solid var(--signal);outline-offset:-2px;border-radius:10px}
  .olist{display:flex;flex-direction:column;gap:10px;margin-top:12px}
  .orow{display:flex;align-items:center;gap:12px;text-align:left;width:100%;border:1px solid var(--line);border-radius:14px;
        background:var(--card);padding:13px 14px;font:inherit;color:var(--ink);cursor:pointer}
  .orow .ono{font-family:'Unbounded';font-size:12.5px;letter-spacing:.5px}
  .orow .osub{font-size:12px;color:var(--ink-3);margin-top:3px}
  .orow b{margin-left:auto;font-family:'Unbounded';font-size:12.5px;font-weight:400;white-space:nowrap}
  .empty{text-align:center;color:var(--ink-3);font-size:13.5px;line-height:1.6;padding:36px 10px 18px}
  .clink{display:flex;align-items:center;gap:12px;border:1px solid var(--line);border-radius:14px;padding:14px;
         margin-top:10px;color:var(--ink);text-decoration:none;font-size:14px}
  .clink small{display:block;color:var(--ink-3);font-size:12px;margin-top:2px}

  /* On a phone the frame is noise — the page IS the app. */
  @media (max-width:520px){
    body{padding:0;background:var(--card);display:block}
    .phone{max-width:none;border:none;border-radius:0;min-height:100dvh}
    header{position:sticky;top:0;z-index:10;background:var(--card);
           padding-top:max(14px,env(safe-area-inset-top))}
    main{padding:14px 15px calc(28px + env(safe-area-inset-bottom))}
    .grid{gap:10px}
    .tabs{margin:0 -15px 6px;padding:0 15px 10px}
    .gal button{width:88%}
    .btn{padding:16px}                       /* thumb-sized targets */
    .opt{padding:10px 15px;font-size:14px}
    .footnote{padding:0 18px 22px;margin-top:0;background:var(--card)}
    input,textarea{font-size:16px}           /* <16px makes iOS Safari zoom on focus */
    .bnav{display:grid;grid-template-columns:repeat(4,1fr);position:fixed;left:0;right:0;bottom:0;z-index:40;
          background:rgba(255,255,255,.94);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);
          border-top:1px solid var(--line);padding:4px 6px calc(4px + env(safe-area-inset-bottom))}
    .bnav.hide{display:none}
    body{padding-bottom:calc(62px + env(safe-area-inset-bottom))}
  }

  /* entrance: cards rise into place as they scroll in */
  .card{opacity:0;transform:translateY(14px) scale(.985);
        transition:opacity .55s cubic-bezier(.2,.7,.2,1),transform .55s cubic-bezier(.2,.7,.2,1),border-color .2s}
  .card.in{opacity:1;transform:none}
  @media (prefers-reduced-motion:reduce){ .card{opacity:1;transform:none;transition:border-color .2s} }

  /* product gallery: snap scrolling + dots */
  .gal{scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch;scrollbar-width:none}
  .gal::-webkit-scrollbar{display:none}
  .gal button{flex:none;width:82%;padding:0;border:none;background:none;scroll-snap-align:center;cursor:zoom-in}
  .gal img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:14px;background:#E4E0D8;display:block}
  .dots{display:flex;justify-content:center;gap:6px;margin:-6px 0 14px}
  .dots i{width:6px;height:6px;border-radius:50%;background:var(--line);transition:all .25s}
  .dots i.on{background:var(--ink);width:18px;border-radius:3px}
  .zoomhint{display:flex;align-items:center;justify-content:center;gap:6px;font-size:11.5px;color:var(--ink-3);
            margin:-4px 0 14px}

  /* fullscreen viewer */
  .lb{position:fixed;inset:0;z-index:50;background:rgba(20,19,17,.97);display:flex;flex-direction:column;
      opacity:0;pointer-events:none;transition:opacity .28s ease}
  .lb.open{opacity:1;pointer-events:auto}
  .lb-top{display:flex;align-items:center;color:#fff;flex:none;
          padding:max(16px,env(safe-area-inset-top)) 18px 16px}
  .lb-count{font-family:'Unbounded';font-size:13px;letter-spacing:1px}
  .lb-x{margin-left:auto;background:none;border:none;color:#fff;font-size:28px;line-height:1;cursor:pointer;
        width:44px;height:44px;display:grid;place-items:center}
  .lb-x:focus-visible{outline:2px solid #fff;outline-offset:3px;border-radius:6px}
  .lb-track{flex:1;display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;align-items:center}
  .lb-track::-webkit-scrollbar{display:none}
  .lb-slide{flex:none;width:100%;height:100%;scroll-snap-align:center;display:grid;place-items:center;
            overflow:auto;padding:8px}
  .lb-slide img{max-width:100%;max-height:100%;object-fit:contain;border-radius:10px;cursor:zoom-in;
                transition:transform .35s cubic-bezier(.2,.7,.2,1);transform-origin:center}
  .lb-slide img.zoomed{transform:scale(2.4);cursor:zoom-out}
  .lb-bot{flex:none;display:flex;gap:8px;justify-content:center;
          padding:14px 18px max(26px,env(safe-area-inset-bottom))}
  .lb-bot button{width:52px;height:52px;border-radius:10px;padding:0;border:2px solid transparent;
                 background:none;cursor:pointer}
  .lb-bot img{width:100%;height:100%;object-fit:cover;border-radius:8px;opacity:.45;transition:opacity .2s}
  .lb-bot button[aria-current="true"]{border-color:#fff}
  .lb-bot button[aria-current="true"] img{opacity:1}
</style>
</head>

// Two are real categories (a boot belongs to exactly one).
// Two are flags (a kids' boot can be new AND in demand).
const FILTERS = [
  { key:'all',   label:'Бүгд',            test:()=>true },
  { key:'hot',   label:'Эрэлттэй',        test:p=>p.hot },
  { key:'fresh', label:'Шинэ',      test:p=>p.fresh },
  { key:'main',  label:'Үндсэн',    test:p=>p.category==='main' },
  { key:'kids',  label:'Хүүхдийн',  test:p=>p.category==='kids' },
];

// Deterministic pseudo-random so the demo is stable across reloads.
let seed = 7;
const rnd = n => { seed = (seed * 1103515245 + 12345) & 0x7fffffff; return seed % n; };

const CATALOG = [], INV = {};
for (const r of RAW) {
  // A kids' boot does not come in size 43. The axis values depend on the category.
  const axes = AXES.map(a => ({
    ...a,
    values: a.name === 'Хэмжээ' && r.cat === 'kids'
      ? ['26','27','28','29','30','31','32','33']
      : [...a.values],
  }));
  const variants = [];
  for (const h of axes[0].values) for (const c of axes[1].values) for (const s of axes[2].values) {
    if (rnd(10) < 3) continue;                       // the factory doesn't make every combination
    const id = `m${r.n}-${h[0]}${c[0]}${s}`;
    const pre = rnd(10) < 2;                         // some pairs are made to order
    variants.push({
      id, sku:id.toUpperCase(),
      options:{ 'Хийцлэл':h, 'Өнгө':c, 'Хэмжээ':s },
      price_delta: (h==='Давхар эсгий'?25000:h==='Арьсан хормойтой'?40000:0) + (+s>=42?10000:0),
      is_preorder: pre,
    });
    INV[id] = {};
    if (!pre) {
      const a = rnd(4), b = rnd(3);
      if (a) INV[id].b1 = a;
      if (b) INV[id].b2 = b;
    }
  }
  CATALOG.push({
    id:`m${r.n}`, sku:`TH-${String(r.n).padStart(3,'0')}`, name:`Загвар ${String(r.n).padStart(2,'0')}`,
    description:'Монгол эсгий. Үйлдвэрийн шууд бүтээгдэхүүн. Салбараас авах эсвэл хүргэлтээр.',
    base_price:r.price, is_active:true, option_axes:axes, variants,
    images:r.imgs.map(IMG),
    category:r.cat, hot:r.hot, fresh:r.fresh,
  });
}

// ── rules: identical to src/orders.ts ─────────────────────────────
const AB='23456789ABCDEFGHJKLMNPQRSTUVWXYZ';
const orderNo = () => {
  const d=new Date();
  const p=String(d.getFullYear()%100).padStart(2,'0')+String(d.getMonth()+1).padStart(2,'0')+String(d.getDate()).padStart(2,'0');
  let s=''; for(let i=0;i<4;i++) s+=AB[Math.floor(Math.random()*AB.length)];
  return `TH-${p}-${s}`;
};
const phone = raw => {
  const d=String(raw).replace(/\D/g,'').replace(/^976/,'');
  if(!/^[5-9]\d{7}$/.test(d)) throw new Error('Утасны дугаар буруу байна. 8 оронтой, 5-9-өөр эхэлсэн байх ёстой.');
  return d;
};
const avail = vid => { const b=INV[vid]||{}; return {total:Object.values(b).reduce((s,q)=>s+q,0), byBranch:b}; };
const label = (p,v) => `${p.name} (${p.option_axes.map(a=>v.options[a.name]).join(' / ')})`;

const FEE = 8000, FREE_OVER = 300000;

function priceOrder(cart, method, branchId){
  if(!cart.length) throw new Error('Сагс хоосон байна');
  if(method==='pickup' && !branchId) throw new Error('Салбараа сонгоно уу');
  const lines = cart.map(l => {
    const p = CATALOG.find(x=>x.id===l.product_id);
    const v = p.variants.find(x=>x.id===l.variant_id);
    const {total, byBranch} = avail(v.id);
    let src = null;
    if(method==='pickup'){
      const here = byBranch[branchId]||0;
      if(here < l.qty){
        const other = BRANCHES.find(b=>b.id!==branchId && (byBranch[b.id]||0) >= l.qty);
        throw new Error(`${label(p,v)}: энэ салбарт байхгүй.` + (other?` ${other.name}-д байна, эсвэл хүргэлтээр авна уу.`:' Хүргэлтээр авах уу?'));
      }
      src = branchId;
    } else if(v.is_preorder){
      src = null;
    } else {
      if(total < l.qty) throw new Error(`${label(p,v)}: ${total} хос үлдсэн`);
      const cover = Object.entries(byBranch).filter(([,q])=>q>=l.qty).sort((a,b)=>b[1]-a[1]);
      if(!cover.length) throw new Error(`${label(p,v)}: нэг салбарт ${l.qty} хос байхгүй. Тусад нь захиална уу.`);
      src = cover[0][0];
    }
    const unit = p.base_price + v.price_delta;
    return { pid:p.id, vid:v.id, src, name:label(p,v), img:p.images[0], unit, qty:l.qty, total:unit*l.qty,
             preorder:v.is_preorder };
  });
  const subtotal = lines.reduce((s,l)=>s+l.total,0);
  const fee = method==='delivery' ? (subtotal>=FREE_OVER?0:FEE) : 0;
  return { lines, subtotal, fee, total:subtotal+fee };
}

// After each choice, re-check which values still lead to a real pair.
function refreshOptions(p){
  p.option_axes.forEach((axis, i) => {
    const box = document.querySelector(`.opts[data-axis="${axis.name}"]`);
    axis.values.forEach((val, j) => {
      const btn = box.children[j];
      const probe = {...sel, [axis.name]: val};
      const reachable = p.variants.some(v =>
        p.option_axes.every(a => probe[a.name] === undefined || v.options[a.name] === probe[a.name])
      );
      btn.disabled = !reachable;
      btn.setAttribute('aria-pressed', String(sel[axis.name] === val));
    });
  });

  const box = document.getElementById('stock');
  const done = p.option_axes.every(a => sel[a.name]);
  if(!done){
    const missing = p.option_axes.filter(a=>!sel[a.name]).map(a=>a.name);
    box.innerHTML = `<div class="stockline pre">Сонгоно уу: ${missing.join(', ')}</div>`;
    document.getElementById('pz').textContent = mnt(p.base_price);
    return;
  }
  const v = p.variants.find(x => p.option_axes.every(a => x.options[a.name] === sel[a.name]));
  document.getElementById('pz').textContent = mnt(p.base_price + v.price_delta);
  const {total, byBranch} = avail(v.id);
  if(v.is_preorder){
    box.innerHTML = `<div class="stockline pre">Захиалгаар хийнэ. 7-10 хоногт бэлэн болно. Салбараас авах боломжгүй.</div>`;
  } else if(total===0){
    box.innerHTML = `<div class="stockline no">Дууссан.</div>`;
  } else {
    const where = BRANCHES.filter(b=>byBranch[b.id]).map(b=>`${b.name}: ${byBranch[b.id]}`).join(' · ');
    box.innerHTML = `<div class="stockline ok">${total} хос бэлэн — ${where}</div>`;
  }
}

function pickOpt(pid, axis, el){
  const p = CATALOG.find(x=>x.id===pid);
  sel[axis] = sel[axis] === el.textContent ? undefined : el.textContent;
  if(sel[axis] === undefined) delete sel[axis];
  refreshOptions(p);
  document.getElementById('perr').textContent = '';
}

function addToCart(pid){
  const p = CATALOG.find(x=>x.id===pid);
  const e = document.getElementById('perr');
  const missing = p.option_axes.filter(a=>!sel[a.name]).map(a=>a.name);
  if(missing.length){ e.textContent = `Сонгоогүй: ${missing.join(', ')}`; return; }
  const v = p.variants.find(x => p.option_axes.every(a => x.options[a.name] === sel[a.name]));
  if(!v){ e.textContent = 'Энэ хослол байхгүй байна.'; return; }
  if(!v.is_preorder && avail(v.id).total === 0){ e.textContent = 'Энэ хос дууссан байна.'; return; }
  const i = cart.findIndex(l=>l.variant_id===v.id);
  if(i>=0) cart[i].qty++; else cart.push({product_id:p.id, variant_id:v.id, qty:1});
  go({name:'cart'});
}

const setMethod = m => { method=m; if(m==='delivery') branch=null; render(); };
const setBranch = b => { branch = branch===b ? null : b; render(); };

function checkView(){
  const o = priceOrder(cart, method, branch);
  app.innerHTML = `
    <button class="back" onclick="go({name:'cart'})">← Сагс</button>
    <div class="eyebrow">${method==='pickup'?'Салбараас авах':'Хүргэлтийн мэдээлэл'}</div>
    <label for="nm">Нэр</label><input id="nm" placeholder="Овог нэр">
    <label for="ph">Утас</label><input id="ph" inputmode="numeric" placeholder="99112233">
    ${method==='delivery'
      ? `<label for="ad">Хаяг</label><textarea id="ad" rows="2" placeholder="Дүүрэг, хороо, байр, тоот"></textarea>`
      : `<div class="note">${BRANCHES.find(b=>b.id===branch).name} — захиалга бэлэн болмогц мессеж очно. Захиалгын дугаараа хэлж авна.</div>`}
    <div class="err" id="cerr"></div>
    <div class="row total"><span>Төлөх дүн</span><b>${mnt(o.total)}</b></div>
    <button class="btn signal" onclick="submitOrder()">QPay-ээр төлөх</button>
  `;
}

function submitOrder(){
  const e=document.getElementById('cerr');
  const name=document.getElementById('nm').value.trim();
  const addrEl=document.getElementById('ad');
  let ph, addr='';
  try{
    if(name.length<2) throw new Error('Нэрээ оруулна уу');
    ph = phone(document.getElementById('ph').value);
    if(method==='delivery'){
      addr = addrEl.value.trim();
      if(addr.length<8) throw new Error('Хаягаа бүтэн оруулна уу');
    }
  }catch(err){ e.textContent=err.message; return; }

  const o = priceOrder(cart, method, branch);
  order = { no:orderNo(), name, phone:ph, addr, method, branch, ...o, paid:false };
  go({name:'qpay'});
}

function qpayView(){
  app.innerHTML = `
    <div class="eyebrow">QPay нэхэмжлэх</div>
    <div style="text-align:center">
      <div class="qr" role="img" aria-label="QPay QR код"></div>
      <div style="font-family:'Unbounded';font-size:20px">${mnt(order.total)}</div>
      <div class="desc" style="margin-top:3px">${order.no}</div>
    </div>
    <div class="axis">Банкны апп сонгох</div>
    <div class="banks">
      ${[['Хаан банк','#0B7A3E'],['Голомт банк','#0C3C8C'],['Хас банк','#C81E2C'],['Төрийн банк','#1B6AA5']]
        .map(([n,c])=>`<button class="bank" onclick="simulatePay()"><span class="bm" style="background:${c}"></span>${n}</button>`).join('')}
    </div>
    <div class="poll" id="poll"><span class="spin"></span>Төлбөр хүлээж байна…</div>
    <div class="note">Сервер QPay-ээс <b>checkPayment</b>-ээр шалгаж байна. Захиалга зөвхөн QPay «PAID» гэж хариулсны дараа төлөгдсөн болно — гүйлгээний зураг илгээх шаардлагагүй.</div>
  `;
}

// Stands in for QPay confirming payment. In production this is checkPayment()
// polling merchant.qpay.mn — never a screenshot, never an admin button.
function simulatePay(){
  document.getElementById('poll').innerHTML='<span class="spin"></span>Банкнаас хариу ирж байна…';
  setTimeout(()=>{
    order.paid=true;
    // stock only moves after QPay confirms
    for(const l of order.lines){ if(l.src && INV[l.vid][l.src]) INV[l.vid][l.src] -= l.qty; }
    if (!myOrders.includes(order)) myOrders.unshift(order);
    cart=[]; go({name:'ticket'});
  },1400);
}

function ticketView(){
  const pickup = order.method==='pickup';
  const steps = pickup
    ? [['Төлбөр баталгаажсан',1],['Бэлтгэж байна',1],['Салбарт бэлэн',0],['Хүлээн авсан',0]]
    : [['Төлбөр баталгаажсан',1],['Бэлтгэж байна',1],['Хүргэлтэд гарсан',0],['Хүргэгдсэн',0]];
  app.innerHTML = `
    <div class="ticket">
      <div class="tst">✓ Төлбөр баталгаажлаа</div>
      <div class="tno">${order.no}</div>
      <div class="thint">Энэ дугаараар захиалгаа хянана.<br>Чат руу бичих, зураг илгээх шаардлагагүй.</div>
      <div style="margin-top:20px">
        ${order.lines.map(l=>`<div class="trow"><span>${l.name} × ${l.qty}</span><b>${mnt(l.total)}</b></div>`).join('')}
        <div class="trow"><span>${pickup?'Салбараас авах':'Хүргэлт'}</span><b>${order.fee?mnt(order.fee):'Үнэгүй'}</b></div>
        <div class="trow" style="margin-top:8px"><span>Нийт</span><b>${mnt(order.total)}</b></div>
      </div>
    </div>
    <div class="axis">${pickup ? BRANCHES.find(b=>b.id===order.branch).name : 'Явц'}</div>
    <div class="steps">${steps.map(([s,on])=>`<div class="step ${on?'on':''}"><span class="pip"></span>${s}</div>`).join('')}</div>
    <div class="note">Үлдэгдэл зөвхөн төлбөр баталгаажсаны дараа хасагдана. Каталог руу буцаад дахин үзээрэй — тоо өөрчлөгдсөн байна.</div>
    <button class="btn ghost" onclick="order=null;go({name:'catalog'})">Дэлгүүр рүү буцах</button>
  `;
}

// ── entrance animation ────────────────────────────────────────────
const reveal = () => {
  const cards = [...document.querySelectorAll('.card')];
  if (!('IntersectionObserver' in window) ||
      matchMedia('(prefers-reduced-motion: reduce)').matches) {
    cards.forEach(c => c.classList.add('in'));
    return;
  }
  const io = new IntersectionObserver((entries, obs) => {
    entries.forEach(e => {
      if (!e.isIntersecting) return;
      const i = cards.indexOf(e.target);
      // stagger by position in the row, so pairs rise together
      e.target.style.transitionDelay = `${(i % 6) * 55}ms`;
      e.target.classList.add('in');
      obs.unobserve(e.target);
    });
  }, { rootMargin: '0px 0px -8% 0px', threshold: 0.08 });
  cards.forEach(c => io.observe(c));
};

// ── gallery dots ──────────────────────────────────────────────────
function syncDots(){
  const g = document.getElementById('gal'), d = document.getElementById('dots');
  if(!g || !d) return;
  const i = Math.round(g.scrollLeft / (g.scrollWidth / g.children.length));
  [...d.children].forEach((el,j)=>el.classList.toggle('on', j===Math.min(i, d.children.length-1)));
}

// ── fullscreen viewer ─────────────────────────────────────────────
let lbEl = null;

function openLb(pid, index){
  const p = CATALOG.find(x=>x.id===pid);
  closeLb();
  lbEl = document.createElement('div');
  lbEl.className = 'lb';
  lbEl.innerHTML = `
    <div class="lb-top">
      <span class="lb-count" id="lbc">${index+1} / ${p.images.length}</span>
      <button class="lb-x" aria-label="Хаах" onclick="closeLb()">×</button>
    </div>
    <div class="lb-track" id="lbt" onscroll="lbSync(${p.images.length})">
      ${p.images.map(u=>`<div class="lb-slide"><img src="${u}" alt="${p.name}" onerror="${imgFallback}"
         onclick="this.classList.toggle('zoomed')"></div>`).join('')}
    </div>
    <div class="lb-bot" id="lbb">
      ${p.images.map((u,i)=>`<button aria-current="${i===index}" onclick="lbGo(${i})">
        <img src="${u}" alt="" onerror="${imgFallback}"></button>`).join('')}
    </div>`;
  document.body.appendChild(lbEl);
  document.body.style.overflow = 'hidden';
  requestAnimationFrame(()=>{
    lbEl.classList.add('open');
    lbGo(index, false);
  });
  document.addEventListener('keydown', lbKeys);
}

function lbGo(i, smooth = true){
  const t = document.getElementById('lbt');
  if(!t) return;
  t.scrollTo({ left: i * t.clientWidth, behavior: smooth ? 'smooth' : 'auto' });
}

function lbSync(n){
  const t = document.getElementById('lbt');
  if(!t) return;
  const i = Math.min(Math.round(t.scrollLeft / t.clientWidth), n-1);
  document.getElementById('lbc').textContent = `${i+1} / ${n}`;
  [...document.getElementById('lbb').children].forEach((b,j)=>b.setAttribute('aria-current', String(j===i)));
  // a zoomed image that scrolls away should reset, or the next one opens mid-zoom
  [...t.children].forEach((s,j)=>{ if(j!==i) s.firstElementChild.classList.remove('zoomed'); });
}

function lbKeys(e){
  if(e.key === 'Escape') closeLb();
  const t = document.getElementById('lbt');
  if(!t) return;
  const i = Math.round(t.scrollLeft / t.clientWidth);
  if(e.key === 'ArrowRight') lbGo(i+1);
  if(e.key === 'ArrowLeft')  lbGo(Math.max(i-1, 0));
}

function closeLb(){
  if(!lbEl) return;
  const el = lbEl; lbEl = null;
  el.classList.remove('open');
  document.body.style.overflow = '';
  document.removeEventListener('keydown', lbKeys);
  setTimeout(()=>el.remove(), 280);
}

render();
</script>
